notes: >-
  Deep analysis going beyond strings(). Packaging changed since 2.1.197: the application is no longer a
  single CommonJS bundle but code-split ESM. The ELF `.bun` section (file offset 0x5c93000, 169,843,365
  bytes, ending in the `---- Bun! ----` trailer) embeds 2,651 files, including 2,395 `chunk-*.js` modules
  and a 24,477-byte `cli` entry loader. bundle/extract.py parses Bun's module table and concatenates the
  2,401 application JS modules into cli.min.js with per-module separators; non-JS assets go to
  bundle/modules/. The beautified cli.beauty.js (1,857,789 lines) is not committed; bundle/README.md has
  the deterministic regeneration command and its SHA-256. The 14 topic docs were produced by a multi-agent
  workflow (one specialist per topic, each adversarially verified against the source), then an overview
  and comparison were synthesised.
