notes: >
  2.1.300 adds a Claude 5.5 generation (Opus 5.5, Sonnet 5.5, Haiku 5.5) plus Opus 5, Fable 5.1 and
  Mythos 5.1; every family alias now defaults to its newest model (opus -> claude-opus-5-5). With the
  remote catalog off (flag tengu_delegated_quail default {mode off}) the code-default main model on
  firstParty for any Opus-default account is claude-opus-5-5; the Opus default now also covers Pro,
  Team and Enterprise subscribers and Bedrock/Vertex. A served/published model catalog (signed seed
  v2224, state.model claude-opus-5) can override defaults when enabled. Catalog gained pricing tiers
  (Haiku 5.5 $0.10/$0.50 with long-prompt tier; Sonnet 5/5.5 $2/$10; Opus 5.5 $4/$20), anthropic
  Google Cloud ids, fallback_3p, effort_cost_index and advisor_rank; native_1m_3p removed and native
  1M is no longer provider-conditional. Fast mode now covers Opus 4.8/5/5.5 (Opus 4.7 dropped).
