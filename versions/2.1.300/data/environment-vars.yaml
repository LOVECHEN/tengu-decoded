- name: CCR_RUNNER_STARTUP_TIMING
  category: bridge-remote
  type: raw-proxy (nr), unregistered
  new: true
  inert_raw_proxy: true
  purpose: The CCR runner sets it in the child env (CCR_RUNNER_STARTUP_TIMING = gn, :612052), but the child reads it only as nr.CCR_RUNNER_STARTUP_TIMING in the startup-timing consume() (:186282), so the value never arrives in this build
  ref: cli.beauty.js:186282
- name: CCR_PREWARM_VDA
  category: bridge-remote
  type: raw-proxy (nr), unregistered
  new: true
  inert_raw_proxy: true
  purpose: Startup-timing field prewarm_vda = nr.CCR_PREWARM_VDA (:186300); inert
  ref: cli.beauty.js:186300
- name: CCR_PREWARM_STAT
  category: bridge-remote
  type: raw-proxy (nr), unregistered
  new: true
  inert_raw_proxy: true
  purpose: Startup-timing field prewarm_stat = nr.CCR_PREWARM_STAT (:186301); inert
  ref: cli.beauty.js:186301
- name: CCR_DELTA_RESET
  category: bridge-remote
  type: raw-proxy (nr), unregistered
  new: true
  inert_raw_proxy: true
  purpose: Startup-timing field delta_reset (:186302) and Kt() = Boolean(nr.CCR_DELTA_RESET) (:603220); inert, so Kt() is always false
  ref: cli.beauty.js:603220
