# ---------------------------------------------------------------------------
# Deterministic Bash pipeline
# ---------------------------------------------------------------------------
bash_pipeline:
  entry: "fpr (429140) -> yBe (429172) -> _Be (429214)"
  steps:
    - {step: clamp, fn: yBe, line: 429172, behavior: "deny if no bashCommandClamp rule admits command; event tengu_bash_command_clamp_denied; crash -> fail-closed", status: NEW}
    - {step: parse, fn: NK, line: 214603, behavior: "tree-sitter; >10000 chars / null / panic -> VP = Symbol('parse-aborted') + tengu_tree_sitter_parse_abort {cmdLength, panic}"}
    - {step: classify, fn: FK, line: 214914, behavior: "simple {commands, bareAssignmentNames} or too-complex {reason, nodeType, differential}"}
    - {step: too_complex, line: 429245, behavior: "try fwo, sandbox nwo (427771), heredoc reparse (tengu_amber_larch, default true); else tengu_bash_ast_too_complex + ask bashMissKind too-complex"}
    - {step: semantics, fn: NTr, line: 429278, behavior: "failure -> ask bashMissKind semantics"}
    - {step: compound_cd_git, lines: "429341-429452", behavior: "multi-cd ask; cd+git ask (untrusted hooks/config); created git structure + git ask"}
    - {step: per_subcommand, fn: LDt, line: 427646, behavior: "deny rules -> ask rules -> path checks C3 -> read-block -> allow rules -> read-only auto-allow -> passthrough no-rule-match"}
    - {step: background_operator, lines: "429188-429202", behavior: "& in otherwise-allowed command, unless NK re-parse succeeds and YDt finds no background op -> ask safetyCheck circuitBreaker backgroundOperator, classifierApprovable false", status: NEW}
  parser:
    module: "M249 chunk-1a78hwks.js"
    max_command_length: 10000                    # Te = 1e4 (214580)
    abort_sentinel: "VP = Symbol('parse-aborted')"  # 214602
    abort_event: "tengu_tree_sitter_parse_abort"  # 214605-214617
    too_complex_sites_total: 149                  # 2.1.197: 85
    too_complex_sites_in_module_249: 148
    lexical_prechecks:                            # 214918-214956
      - "Contains lone surrogate"
      - "Contains control characters"
      - "Contains Unicode whitespace"
      - "Contains backslash-escaped whitespace"
      - "Contains zsh ~[ dynamic directory syntax"
      - "Contains zsh =cmd equals expansion"
      - "Contains zsh <N-M> numeric-range glob"
      - "Contains brace with quote character (expansion obfuscation)"
    parse_abort_reason: "Parser aborted (timeout, resource limit, or over-length)"  # 214963
  bash_miss_kinds: [sed-dangerous, shell-expansion, cd-multi-positional, flag-validation, cd-compound-read, cd-compound-write, cd-compound-redirect, process-substitution, net-redirect, multi-cd, cd-git-compound, shell-operators, no-rule-match, too-complex, semantics]
  prefix_extractor:
    fn: "YZ(specRegistry, cmd, depth, wrapDepth)"  # 545130
    limits: "wrapDepth > 2 or depth > 10 -> null"
    wrapper_set: "v2r = new Set(['nice']) (545123) + spec args[].isCommand"
    merge: "Sds (545177) / C2r common word prefix (545203)"
    git_opaque_config_keys: "T2r (545107): core.worktree, core.bare, include.*, includeif.*, protocol.*.allow, core.sshcommand, core.gitproxy -> opaque (NEW; core.sshcommand 0 in 2.1.197)"
    existed_in_2_1_197: true

